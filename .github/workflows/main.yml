name: Sync upstream main

on:
  schedule:
    # Performed every Wednesday and Saturday at 03:00 UTC
    - cron: "0 3 * * 3,6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-upstream:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout local main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream and fetch
        run: |
          git remote add upstream https://github.com/langflow-ai/langflow.git
          git fetch upstream main

      - name: Reset main to upstream/main
        run: |
          git checkout main
          git reset --hard upstream/main

      - name: Push updated main
        run: |
          git push origin main --force-with-lease
