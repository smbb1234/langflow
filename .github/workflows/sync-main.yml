name: Sync upstream main

on:
  schedule:
    # Performed every Wednesday and Saturday at 03:00 UTC
    - cron: "0 3 * * 3,6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-upstream:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout local main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SYNC_MAIN_PAT }}

      - name: Configure Git
        run: |
          git config user.name "smbb1234"
          git config user.email "peter_926@live.cn"

      - name: Add upstream and fetch
        run: |
          git remote add upstream https://github.com/langflow-ai/langflow.git
          git fetch upstream main
          git fetch origin main

      - name: Reset main to upstream/main
        run: |
          git checkout main
          git reset --hard upstream/main

      - name: Push updated main
        run: |
          git push --force-with-lease https://x-access-token:${{ secrets.SYNC_MAIN_PAT }}@github.com/smbb1234/langflow.git main
